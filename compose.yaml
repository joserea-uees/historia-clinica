services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME en .env}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Define POSTGRES_ADMIN_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD en .env}
      DB_RUNTIME_USER: ${DB_RUNTIME_USER:?Define DB_RUNTIME_USER en .env}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Define DB_RUNTIME_PASSWORD en .env}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:?Define DB_MIGRATION_USER en .env}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Define DB_MIGRATION_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend_private
      - local_access

  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Define DB_NAME en .env}
      DB_RUNTIME_USER: ${DB_RUNTIME_USER:?Define DB_RUNTIME_USER en .env}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Define DB_RUNTIME_PASSWORD en .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/salud/disponible').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend_private
      - local_access

  migrate:
    build:
      context: .
      target: build
    profiles: ["tools"]
    environment:
      DATABASE_MIGRATION_URL: postgresql://${DB_MIGRATION_USER:?Define DB_MIGRATION_USER en .env}:${DB_MIGRATION_PASSWORD:?Define DB_MIGRATION_PASSWORD en .env}@db:5432/${DB_NAME:?Define DB_NAME en .env}
    command: ["node", "--import", "tsx", "database/migrations/aplicar-migraciones.ts"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_private

  alta-administrador:
    build:
      context: .
      target: build
    profiles: ["tools"]
    environment:
      DATABASE_MIGRATION_URL: postgresql://${DB_MIGRATION_USER:?Define DB_MIGRATION_USER en .env}:${DB_MIGRATION_PASSWORD:?Define DB_MIGRATION_PASSWORD en .env}@db:5432/${DB_NAME:?Define DB_NAME en .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ORGANIZATION_NAME: ${BOOTSTRAP_ORGANIZATION_NAME:-Consultorio principal}
    command: ["node", "--import", "tsx", "database/crear-administrador-inicial.ts"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_private

networks:
  backend_private:
    internal: true
  local_access:
    driver: bridge

volumes:
  postgres_data:
